

name: Build Anime Tracker Image

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build and Test
        run: ./mvnw -B clean verify

      - name: Generate Image Tag
        if: github.event_name == 'push'
        id: tag
        run: |
          DATE=$(date -u +'%Y-%m-%d')
          SHA=$(git rev-parse --short HEAD)
          echo "tag=main-${DATE}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASS }}

      - name: Build and Push Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/anime-tracker:${{ steps.tag.outputs.tag || 'pr-test' }}

      - name: Show Image Tag
        if: github.event_name == 'push'
        run: echo "Published image = ${{ secrets.DOCKERHUB_USERNAME }}/anime-tracker:${{ steps.tag.outputs.tag }}"
